name: avisos
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node envia.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AVISOS_JSON: ${{ secrets.AVISOS_JSON }}
      - name: apuntar los enviados
        run: |
          git config user.name "avisos"
          git config user.email "avisos@users.noreply.github.com"
          git add enviados.json
          git diff --cached --quiet || (git commit -m "Avisos enviados" && git push)
